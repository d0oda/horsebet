name: Seed DB Cache

# Downloads horsebet.db.gz from the db-seed-latest GitHub release,
# decompresses it, and saves it to the GitHub Actions cache so race
# day runs have full historical data from the start.
#
# Usage: GitHub → Actions → "Seed DB Cache" → Run workflow → type "seed"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed" to confirm'
        required: true
        type: string

env:
  DATABASE_URL: sqlite:///horsebet.db
  PYTHON_VERSION: '3.10'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.confirm == 'seed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download horsebet.db.gz from release
        run: |
          echo "⬇️  Downloading horsebet.db.gz from db-seed-latest release..."
          gh release download db-seed-latest \
            --repo ${{ github.repository }} \
            --pattern "horsebet.db.gz" \
            --output horsebet.db.gz
          ls -lh horsebet.db.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decompress
        run: |
          echo "📦 Decompressing..."
          gunzip horsebet.db.gz
          ls -lh horsebet.db

      - name: Verify DB
        run: |
          python3 -c "
          import sqlite3
          con = sqlite3.connect('horsebet.db')
          races = con.execute('SELECT COUNT(*) FROM races').fetchone()[0]
          entries = con.execute('SELECT COUNT(*) FROM entries').fetchone()[0]
          print(f'✅ DB verified: {races:,} races, {entries:,} entries')
          con.close()
          "

      - name: Get today's date for cache key
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Save horsebet.db to cache
        uses: actions/cache/save@v4
        with:
          path: horsebet.db
          key: horsebet-db-${{ steps.date.outputs.date }}

      - name: Done
        run: |
          echo "✅ horsebet.db is now in cache under key: horsebet-db-${{ steps.date.outputs.date }}"
          echo "The race day pipeline will restore it automatically on the next run."
