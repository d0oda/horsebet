name: Race Day Pipeline

on:
  # Kokura races start as early as 09:45 JST (00:45 UTC)
  # Run every 10 min from 23:30-08:30 UTC (08:30-17:30 JST) on Fri-Sun
  # Two cron entries needed: one for late Friday/Saturday, one for early Sat/Sun
  schedule:
    - cron: '*/10 0-8 * * 0,6'    # Sat & Sun 00:00-08:59 UTC
    - cron: '30/10 23 * * 5,6'    # Fri & Sat 23:30-23:59 UTC (Sat/Sun JST morning)

  # Manual trigger with date override
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date (YYYY-MM-DD). Leave blank for today (JST).'
        required: false
        type: string
      skip_scrape:
        description: 'Skip scraping (races already in DB)'
        required: false
        default: false
        type: boolean
      skip_odds:
        description: 'Skip odds fetch'
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PYTHON_VERSION: '3.10'

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine race date
        id: date
        run: |
          if [ -n "${{ inputs.race_date }}" ]; then
            echo "date=${{ inputs.race_date }}" >> $GITHUB_OUTPUT
          else
            # Default: today in JST (UTC+9)
            echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "Race date: $(cat $GITHUB_OUTPUT | grep date | cut -d= -f2)"

      - name: Check if race day
        id: check
        run: |
          DATE="${{ steps.date.outputs.date }}"
          DOW=$(date -d "$DATE" +%u 2>/dev/null || gdate -d "$DATE" +%u)
          # JRA races are typically Sat(6) and Sun(7)
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ] || [ -n "${{ inputs.race_date }}" ]; then
            echo "is_race_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_race_day=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not a race day ($DATE is weekday $DOW), skipping"
          fi

      - name: Run pipeline
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          FLAGS=""

          # On cron schedule: check if races exist in DB already
          # Only scrape on the very first run of the day (e.g. 23:30 UTC / 08:30 JST)
          # Otherwise just update odds
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$HOUR" = "23" ] && [ "$MINUTE" = "30" ]; then
              echo "🌅 First run of the day - full scrape enabled"
            else
              echo "⚡ Live odds update - skipping scrape"
              FLAGS="$FLAGS --skip-scrape"
            fi
          elif [ "${{ inputs.skip_scrape }}" = "true" ]; then
            FLAGS="$FLAGS --skip-scrape"
          fi
          
          if [ "${{ inputs.skip_odds }}" = "true" ]; then
            FLAGS="$FLAGS --skip-odds"
          fi

          echo "🏇 Running pipeline for $DATE $FLAGS"
          python pipeline.py --date "$DATE" --version 2025_hybrid --ev-threshold 0.15 $FLAGS

      - name: Upload predictions artifact
        if: steps.check.outputs.is_race_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.date.outputs.date }}
          path: |
            results/predictions_*.json
            results/data.json
          retention-days: 30

      - name: Deploy results to GitHub Pages
        if: steps.check.outputs.is_race_day == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./results
          destination_dir: results
          keep_files: true
