name: Race Day Pipeline

on:
  # Races run 09:45 – 16:30 JST = 00:45 – 07:30 UTC
  schedule:
    - cron: '30,40,50 0 * * 0,6'      # Sat & Sun 00:30-00:50 UTC = 09:30-09:50 JST
    - cron: '*/10 1-7 * * 0,6'        # Sat & Sun 01:00-07:50 UTC = 10:00-16:50 JST

  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date (YYYY-MM-DD). Leave blank for today (JST).'
        required: false
        type: string

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
  WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
  PYTHON_VERSION: '3.10'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine race date
        id: date
        run: |
          if [ -n "${{ inputs.race_date }}" ]; then
            echo "date=${{ inputs.race_date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "Race date: $(cat $GITHUB_OUTPUT | grep date | cut -d= -f2)"

      - name: Check if race day
        id: check
        run: |
          DATE="${{ steps.date.outputs.date }}"
          DOW=$(date -d "$DATE" +%u 2>/dev/null || gdate -d "$DATE" +%u)
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ] || [ -n "${{ inputs.race_date }}" ]; then
            echo "is_race_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_race_day=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not a race day ($DATE is weekday $DOW), skipping"
          fi

      # ── Step 1: Scrape races (first run only) ──
      - name: Scrape races
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          RACE_COUNT=$(python -c "
          from scraper.db import get_session
          from sqlalchemy import text
          with get_session() as s:
              n = s.execute(text(\"SELECT COUNT(*) FROM horsebet.races WHERE date = '$DATE'\")).scalar()
              print(n)
          ")
          if [ "$RACE_COUNT" -gt "0" ]; then
            echo "✅ $RACE_COUNT races already in DB, skipping scrape"
          else
            echo "🔍 Scraping races for $DATE"
            python pipeline.py --date "$DATE" --version retrain_20260507_1645 \
              --skip-odds --skip-predict --skip-paddock --skip-notify
          fi

      # ── Step 2: Race Watcher (fresh odds → predict → notify) ──
      - name: Race watcher
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          python race_watcher.py --date "$DATE" --once --lead-time 15

      # ── Step 3: Upload + deploy ──
      - name: Upload artifacts
        if: steps.check.outputs.is_race_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.date.outputs.date }}
          path: |
            results/predictions_*.json
            results/data.json
            results/bets.txt
            results/watcher_state_*.json
          retention-days: 30
          overwrite: true

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.is_race_day == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./results
          destination_dir: results
          keep_files: true
