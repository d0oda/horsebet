name: Race Day Pipeline

on:
  # Races run 09:45 – 16:30 JST = 00:45 – 07:30 UTC
  # We start the pipeline at 08:00 JST to scrape races early.
  schedule:
    - cron: '*/10 23 * * 5,6'         # Fri, Sat 23:00-23:50 UTC = 08:00-08:50 JST (Sat, Sun)
    - cron: '*/10 0-8 * * 0,6'        # Sat, Sun 00:00-08:50 UTC = 09:00-17:50 JST (Sat, Sun)

  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date (YYYY-MM-DD). Leave blank for today (JST).'
        required: false
        type: string

env:
  DATABASE_URL: sqlite:///horsebet.db
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
  WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
  PYTHON_VERSION: '3.10'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODEL_VERSION: retrain_20260822_2143

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine race date
        id: date
        run: |
          if [ -n "${{ inputs.race_date }}" ]; then
            echo "date=${{ inputs.race_date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "Race date: $(cat $GITHUB_OUTPUT | grep date | cut -d= -f2)"

      - name: Check if race day
        id: check
        run: |
          DATE="${{ steps.date.outputs.date }}"
          DOW=$(date -d "$DATE" +%u 2>/dev/null || gdate -d "$DATE" +%u)
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ] || [ -n "${{ inputs.race_date }}" ]; then
            echo "is_race_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_race_day=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not a race day ($DATE is weekday $DOW), skipping"
          fi

      # ── Database: restore from cache (persisted between runs) ──
      - name: Restore horsebet.db from cache
        if: steps.check.outputs.is_race_day == 'true'
        id: db_cache
        uses: actions/cache/restore@v4
        with:
          path: horsebet.db
          # Falls back to any previous horsebet-db- cache if today's isn't found
          key: horsebet-db-${{ steps.date.outputs.date }}
          restore-keys: |
            horsebet-db-

      - name: Bootstrap empty DB if cache miss
        if: steps.check.outputs.is_race_day == 'true' && steps.db_cache.outputs.cache-hit != 'true'
        run: |
          echo "⚠️  No cached DB found — bootstrapping empty schema from alembic migrations."
          echo "    Predictions will have no historical form data this run."
          DATABASE_URL=sqlite:///horsebet.db alembic upgrade head

      # ── Step 1: Scrape races ──
      - name: Scrape races
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "🔍 Scraping races for $DATE"
          python pipeline.py --date "$DATE" --version ${{ env.MODEL_VERSION }} \
            --skip-odds --skip-predict --skip-paddock --skip-notify

      # ── Step 2: Restore watcher state ──
      - name: Restore watcher state
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p results
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- results/watcher_state_$DATE.json 2>/dev/null || echo "No previous state found"

      # ── Step 3: Race watcher (odds → predict → notify) ──
      - name: Race watcher
        if: steps.check.outputs.is_race_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          python race_watcher.py --date "$DATE" --once --lead-time 15

      # ── Step 4: Save updated DB to cache ──
      - name: Save horsebet.db to cache
        if: steps.check.outputs.is_race_day == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: horsebet.db
          key: horsebet-db-${{ steps.date.outputs.date }}

      # ── Step 5: Upload artifacts ──
      - name: Upload artifacts
        if: steps.check.outputs.is_race_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.date.outputs.date }}
          if-no-files-found: ignore
          path: |
            results/predictions_*.json
            results/data.json
            results/bets.txt
            results/watcher_state_*.json
          retention-days: 30
          overwrite: true

      # ── Step 6: Deploy to GitHub Pages ──
      - name: Deploy to GitHub Pages
        if: steps.check.outputs.is_race_day == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./results
          destination_dir: results
          keep_files: true
