<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UmaEdge — AI-powered Japanese horse racing predictions and results viewer" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UmaEdge — Race Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">UmaEdge</div>
    <div class="header-meta">
      <span class="badge badge-model" id="header-model">—</span>
      <span class="badge badge-date" id="header-date">—</span>
      <span class="badge badge-live">● Live</span>
    </div>
  </header>

  <div id="app">
    <div class="container">
      <div class="loading-state">
        <div class="spinner"></div>
        <p style="color:var(--text-muted);font-size:13px;">Loading race data…</p>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
